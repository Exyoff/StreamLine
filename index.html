<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreamLine">
<meta name="theme-color" content="#0a0d13">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="StreamLine — precise polygon modelling in the browser, built for iPhone and iPad.">
<title>StreamLine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
<script>/* the saved theme before first paint (no flash of the default colours) */
try { var t = JSON.parse(localStorage.getItem('streamline.settings.v1') || '{}').theme; if (t && t !== 'midnight') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="boot"><div class="spin"></div><p>Loading the CAD kernel…</p></div>
<div id="app">
  <main id="viewport">
    <div id="hud"></div>
    <canvas id="nav" aria-label="View axes"></canvas>
    <div class="vcol glass" id="vtools-r">
      <button class="fab" id="btn-persp" aria-label="Perspective / orthographic"></button>
      <button class="fab" id="btn-frame" aria-label="Frame selection"></button>
      <button class="fab" id="btn-snap" aria-label="Snapping"></button>
      <button class="fab" id="btn-xray" aria-label="X-ray"></button>
    </div>
    <div id="toolrail" class="glass">
      <nav id="tools"></nav>
      <div class="railsep"></div>
      <div id="vtools-l">
        <button class="fab" id="btn-multi" aria-label="Multi-select"></button>
        <button class="fab" id="btn-all" aria-label="Select all / none"></button>
      </div>
    </div>
    <div id="lastop" class="card glass" hidden></div>
    <div id="draw-card" class="card glass" hidden></div>
    <div id="measure-card" class="card glass" hidden></div>
    <div id="cmdhistory" hidden></div>
    <div id="timeline" class="glass" aria-label="History timeline"></div>
    <div id="cmdbar" hidden>
      <div class="cmdrow" id="cmdlog" title="Tap for the command history"></div>
      <div class="cmdrow" id="cmdprompt"></div>
      <div class="cmdrow">
        <input id="cmdin" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="Type a command or value" aria-label="Command line">
        <button class="cmdbtn" id="cmd-enter" aria-label="Enter">⏎</button>
        <button class="cmdbtn" id="cmd-esc" aria-label="Escape">Esc</button>
      </div>
      <div class="cmdrow" id="statusbar">
        <button data-st="grid">GRID</button><button data-st="snap">SNAP</button><button data-st="ortho">ORTHO</button><button data-st="polar">POLAR</button><button data-st="osnap">OSNAP</button>
      </div>
    </div>
  </main>

  <!-- floating Liquid Glass chrome over the full-screen view -->
  <header id="topbar">
    <button class="ib glass circ" id="btn-menu" aria-label="Menu"></button>
    <div class="spacer"></div>
    <button id="layerpill" class="glass" aria-label="Layers and items"></button>
    <button class="ib glass circ" id="btn-look" aria-label="Look: theme, lighting, edges"></button>
    <button class="ib glass circ" id="btn-history" aria-label="History"></button>
    <button class="ib glass circ" id="btn-props" aria-label="Settings"></button>
  </header>

  <div id="stationbar">
    <div id="actions" class="scrollrow glass"></div>
    <div class="botrow">
      <div class="glass capsule" id="undo-cap">
        <button class="ib" id="btn-undo" aria-label="Undo"></button>
        <button class="ib" id="btn-redo" aria-label="Redo"></button>
      </div>
      <div class="seg glass" id="ws-seg" role="tablist" aria-label="Selection mode">
        <button data-pick="edge" title="Curves and edges (2)">Edge</button>
        <button data-pick="face" title="Regions and faces (3)">Face</button>
        <button data-pick="solid" title="Solids (4)">Solid</button>
      </div>
      <button class="ib glass circ" id="btn-cmd" aria-label="Search commands"></button>
    </div>
  </div>

  <section id="sheet" class="glass" aria-hidden="true">
        <div class="sheet-head">
      <div class="seg" id="sheet-tabs">
        <button data-tab="history">History</button>
        <button data-tab="objects">Items</button>
        <button data-tab="item">Info</button>
        <button data-tab="settings">Settings</button>
      </div>
      <button class="ib" id="sheet-close" aria-label="Close"></button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <div id="scrim" hidden></div>
  <div id="popover" class="popover glass" hidden></div>
  <div id="keypad" class="glass" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".json,.step,.stp,.stl,.obj,application/json,model/stl,model/obj" hidden>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
